<style>
/* ── forms ──────────────────────────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.field label b{color:var(--cyan);font-weight:400}
input[type=text],input[type=number],select,textarea{
  background:rgba(5,11,22,.85);border:1px solid var(--line);border-radius:9px;color:var(--txt);
  font-family:var(--mono);font-size:13px;padding:9px 11px;outline:none;transition:.18s;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--line2);box-shadow:0 0 0 3px rgba(0,229,255,.1)}
input::placeholder,textarea::placeholder{color:var(--dim)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--cyan) 50%),linear-gradient(135deg,var(--cyan) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
select option{background:#0a1326;color:var(--txt)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,rgba(0,229,255,.5),rgba(0,229,255,.12));border:1px solid var(--line-soft)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#9ff4ff,#00b8e0);border:1px solid rgba(0,229,255,.9);box-shadow:0 0 10px rgba(0,229,255,.7);margin-top:-6.5px}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:rgba(0,229,255,.2)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#00d4f5;border:1px solid #aef;box-shadow:0 0 10px rgba(0,229,255,.7)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:rgba(5,11,22,.8)}
.seg button{background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:8px 13px;cursor:pointer;transition:.15s;border-right:1px solid var(--line-soft)}
.seg button:last-child{border-right:0}
.seg button.on{background:rgba(0,229,255,.16);color:var(--cyan);text-shadow:var(--glow-cy)}
.sw{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.sw input{display:none}
.sw .tr{width:38px;height:20px;border-radius:999px;background:rgba(20,32,55,.9);border:1px solid var(--line);position:relative;transition:.2s;flex:0 0 auto}
.sw .tr::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:.2s}
.sw input:checked + .tr{background:rgba(0,229,255,.25);border-color:var(--line2)}
.sw input:checked + .tr::after{left:20px;background:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,.8)}
.sw .sl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}

/* ── buttons ────────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:11px 20px;border-radius:10px;border:1px solid var(--line2);color:var(--cyan);
  background:linear-gradient(180deg,rgba(0,229,255,.14),rgba(0,229,255,.04));transition:.18s;position:relative;overflow:hidden;
}
.btn svg{width:15px;height:15px}
.btn:hover{box-shadow:0 0 20px rgba(0,229,255,.3);border-color:var(--cyan);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.primary{background:linear-gradient(180deg,#00c8ef,#0095c8);color:#02141f;font-weight:700;border-color:rgba(160,240,255,.6);text-shadow:none}
.btn.primary:hover{box-shadow:0 0 26px rgba(0,210,255,.55)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{color:var(--cyan);border-color:var(--line2)}
.btn.danger{border-color:rgba(255,56,96,.5);color:var(--red);background:linear-gradient(180deg,rgba(255,56,96,.14),rgba(255,56,96,.03))}
.btn.sm{padding:7px 13px;font-size:10px;border-radius:8px}

/* ── AI console ─────────────────────────────────────────────────────────── */
.console{
  background:rgba(2,6,13,.92);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  font-family:var(--mono);font-size:12.5px;line-height:1.75;min-height:130px;max-height:420px;overflow:auto;position:relative;
}
.console::before{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,255,229,.012) 3px 4px)}
.console .ln{white-space:pre-wrap;word-break:break-word}
.console .ln.sys{color:var(--teal)}
.console .ln.usr{color:#fff}
.console .ln.err{color:var(--red)}
.console .ln.hint{color:var(--muted)}
.cursor::after{content:"█";color:var(--cyan);animation:blink .9s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.ai-title{font-size:15px;font-weight:700;color:#fff;margin:4px 0 8px;display:flex;align-items:center;gap:9px}
.ai-src{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.1em;margin-top:10px}
.ai-block{margin:8px 0;padding:10px 13px;border-radius:9px;border:1px solid var(--line-soft);background:rgba(8,15,30,.5);font-size:13px;line-height:1.65}
.ai-block b,.ai-block strong{color:var(--cyan);font-weight:600}
.ai-block ul{list-style:none;margin-top:4px}
.ai-block li{padding-left:18px;position:relative;margin-bottom:5px}
.ai-block li::before{content:"▸";position:absolute;left:0;color:var(--cyan);font-size:10px;top:2px}
.ai-block.warn{border-color:rgba(255,180,84,.35);background:rgba(255,180,84,.05)}
.ai-block.warn li::before{content:"⚠";color:var(--amber)}
.ai-block.good{border-color:rgba(61,255,176,.3);background:rgba(61,255,176,.04)}
.ai-block.good li::before{content:"✓";color:var(--green)}
.ai-block.settings li::before{content:"⚙";color:var(--violet);font-size:9px;top:3px}
.ai-rel button{margin:3px 4px 0 0}
.qchip{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line-soft);background:rgba(6,12,24,.6);border-radius:999px;padding:6px 12px;cursor:pointer;transition:.15s}
.qchip:hover{color:var(--cyan);border-color:var(--line2);box-shadow:0 0 10px rgba(0,229,255,.15)}

/* progress / typing bar */
.pbar{height:3px;border-radius:2px;background:rgba(0,229,255,.1);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan));box-shadow:0 0 10px rgba(0,229,255,.7);width:0%;transition:width .25s}

/* ── calculators ────────────────────────────────────────────────────────── */
.rail{display:flex;flex-direction:column;gap:5px;max-height:calc(100vh - 210px);overflow-y:auto;padding-right:6px;position:sticky;top:118px}
.rail button{
  text-align:left;background:rgba(7,13,26,.65);border:1px solid var(--line-soft);border-radius:9px;color:var(--muted);
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:9px 12px;cursor:pointer;transition:.15s;display:flex;gap:9px;align-items:center;
}
.rail button .no{color:var(--dim);font-size:9px}
.rail button:hover{color:var(--txt);border-color:var(--line)}
.rail button.on{color:var(--cyan);border-color:var(--line2);background:rgba(0,229,255,.1);box-shadow:0 0 14px rgba(0,229,255,.12)}
.rail .rgroup{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase;margin:9px 0 3px;padding-left:2px}
.calcgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.calcgrid .full{grid-column:1/-1}
.res{border:1px solid var(--line-soft);border-left:3px solid var(--cyan);border-radius:10px;background:rgba(8,15,30,.55);padding:11px 14px;margin-bottom:10px;animation:fadeup .3s ease-out}
.res .rh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.res .rl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.res .rv{font-family:var(--mono);font-size:21px;font-weight:700;color:#fff;text-shadow:0 0 12px rgba(0,229,255,.4)}
.res .rv small{font-size:11px;color:var(--muted);font-weight:400;margin-left:5px}
.res .ri{font-size:12px;color:var(--muted);line-height:1.6;margin-top:6px}
.res.ok{border-left-color:var(--green)} .res.ok .rv{color:var(--green);text-shadow:0 0 12px rgba(61,255,176,.4)}
.res.caution{border-left-color:var(--amber)} .res.caution .rv{color:var(--amber);text-shadow:0 0 12px rgba(255,180,84,.4)}
.res.danger{border-left-color:var(--red)} .res.danger .rv{color:var(--red);text-shadow:0 0 12px rgba(255,56,96,.45)}
.res.info{border-left-color:var(--violet)}
.chartbox{background:rgba(4,9,18,.6);border:1px solid var(--line-soft);border-radius:10px;padding:8px;position:relative}
.chartbox canvas{display:block;width:100%;border-radius:6px}
.chartbox .ct{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:4px 8px 6px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
input.bad{border-color:rgba(255,56,96,.6);box-shadow:0 0 0 3px rgba(255,56,96,.1)}

/* ── waveform lab ───────────────────────────────────────────────────────── */
.wavelab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:14px}
.scalars{display:flex;flex-direction:column;gap:10px}
.scalar{position:relative;background:rgba(3,8,16,.9);border:1px solid var(--line-soft);border-radius:10px;padding:6px 8px 4px}
.scalar .sl{position:absolute;top:7px;left:11px;font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--muted);z-index:2;text-transform:uppercase}
.scalar .sv{position:absolute;top:7px;right:11px;font-family:var(--mono);font-size:12px;color:var(--cyan);text-shadow:var(--glow-cy);z-index:2}
.scalar canvas{display:block;width:100%;height:120px}
.loops{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.loop{position:relative;background:rgba(3,8,16,.9);border:1px solid var(--line-soft);border-radius:10px;padding:6px 8px 4px}
.loop .sl{position:absolute;top:7px;left:11px;font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--muted);z-index:2}
.loop canvas{display:block;width:100%;height:190px}
.deck{display:flex;flex-direction:column;gap:12px}
.deck .drow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deck .drow.one{grid-template-columns:1fr}
.deck .dval{font-family:var(--mono);font-size:10px;color:var(--cyan);float:right}
.ro-row{display:flex;gap:7px;flex-wrap:wrap}
.ro{font-family:var(--mono);font-size:10px;letter-spacing:.06em;border:1px solid var(--line-soft);border-radius:7px;padding:5px 9px;background:rgba(6,12,24,.7);color:var(--muted)}
.ro b{color:var(--cyan);font-weight:600;font-size:12px}
.ro.warn b{color:var(--amber)} .ro.bad b{color:var(--red)}
.atlasgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px}
.atlas{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:12px}
.atlas canvas{display:block;width:100%;height:130px;background:rgba(3,8,16,.8);border-radius:8px;border:1px solid var(--line-soft);margin-bottom:9px}
.atlas .an{font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;margin-bottom:4px}
.atlas .ad{font-size:11.5px;color:var(--muted);line-height:1.55;margin-bottom:7px}
.atlas .aa{font-size:11px;color:var(--teal);line-height:1.5;border-left:2px solid rgba(0,255,198,.4);padding-left:9px}

/* ── dashboard widgets ──────────────────────────────────────────────────── */
.stat{display:flex;flex-direction:column;gap:3px;padding:13px 15px;background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--cyan),transparent)}
.stat .sv{font-family:var(--mono);font-size:23px;font-weight:700;color:#fff;text-shadow:0 0 14px rgba(0,229,255,.35)}
.stat .sv small{font-size:11px;color:var(--muted);font-weight:400}
.stat .sn{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.vit{display:flex;align-items:center;gap:12px;padding:12px 15px;background:rgba(6,12,24,.55);border:1px solid var(--line-soft);border-radius:12px;min-width:0}
.vit .vic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;border:1px solid var(--line)}
.vit .vic svg{width:17px;height:17px}
.vit .vv{font-family:var(--mono);font-size:19px;font-weight:700;color:#fff;line-height:1}
.vit .vv small{font-size:10px;color:var(--muted);font-weight:400}
.vit .vl{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.vit.hb .vic{color:var(--red);border-color:rgba(255,56,96,.4);background:rgba(255,56,96,.08);animation:hb 1s infinite}
.vit.o2 .vic{color:var(--cyan);border-color:var(--line);background:rgba(0,229,255,.08)}
.vit.co2 .vic{color:var(--amber);border-color:rgba(255,180,84,.4);background:rgba(255,180,84,.07)}
.vit.paw .vic{color:var(--teal);border-color:rgba(0,255,198,.35);background:rgba(0,255,198,.07)}
@keyframes hb{0%,100%{box-shadow:0 0 0 0 rgba(255,56,96,.35)}50%{box-shadow:0 0 0 7px rgba(255,56,96,0)}}
.ticker{overflow:hidden;position:relative;background:rgba(5,11,22,.7);border:1px solid var(--line-soft);border-radius:10px;padding:10px 0}
.ticker .tk{display:inline-block;white-space:nowrap;font-family:var(--mono);font-size:12px;color:var(--teal);padding-left:100%;animation:tick 52s linear infinite}
.ticker .tk b{color:var(--cyan);letter-spacing:.14em}
@keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.heroset{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ── timeline / accordion / misc reference ──────────────────────────────── */
.tl{position:relative;margin:6px 0 4px;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:linear-gradient(180deg,var(--cyan),rgba(0,229,255,.05))}
.tl .ev{position:relative;margin-bottom:14px}
.tl .ev::before{content:"";position:absolute;left:-22px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--bg1);border:2px solid var(--cyan);box-shadow:0 0 8px rgba(0,229,255,.5)}
.tl .yr{font-family:var(--mono);font-size:11px;color:var(--cyan);letter-spacing:.14em}
.tl .tt{font-size:13px;font-weight:600;color:#fff;margin:2px 0}
.tl .td{font-size:12px;color:var(--muted);line-height:1.55}
details.acc{border:1px solid var(--line-soft);border-radius:11px;background:var(--panel);margin-bottom:10px;overflow:hidden}
details.acc summary{
  list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:11px;
  font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt);transition:.15s;user-select:none;
}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .ic{color:var(--cyan);display:flex}
details.acc summary .ic svg{width:16px;height:16px}
details.acc summary::after{content:"＋";margin-left:auto;color:var(--cyan);font-size:13px;transition:.2s}
details.acc[open] summary::after{content:"−";transform:rotate(180deg)}
details.acc summary:hover{color:var(--cyan)}
details.acc .accb{padding:2px 18px 16px;border-top:1px solid var(--line-soft);animation:fadeup .25s ease-out}
.glossary{columns:2;column-gap:22px}
.gitem{break-inside:avoid;margin-bottom:11px;padding:10px 13px;border:1px solid var(--line-soft);border-radius:9px;background:rgba(7,13,26,.5)}
.gitem .gt{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--cyan)}
.gitem .gd{font-size:12px;color:var(--muted);line-height:1.55;margin-top:3px}

/* ── boot overlay ───────────────────────────────────────────────────────── */
#boot{position:fixed;inset:0;z-index:9999;background:radial-gradient(1000px 600px at 50% 40%,#071120,#02050b 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;transition:opacity .45s}
#boot.done{opacity:0;pointer-events:none}
#boot .blogo{width:96px;height:96px;filter:drop-shadow(0 0 26px rgba(0,229,255,.55));animation:logospin 6s ease-in-out infinite}
@keyframes logospin{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.04)}}
#boot .bt1{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:.34em;color:#fff;text-shadow:0 0 24px rgba(0,229,255,.7);margin-top:20px}
#boot .bt1 span{color:var(--cyan)}
#boot .bt2{font-family:var(--mono);font-size:10px;letter-spacing:.4em;color:var(--muted);margin-top:8px;text-transform:uppercase}
#boot .blines{font-family:var(--mono);font-size:11.5px;color:var(--teal);line-height:2;margin-top:26px;min-height:130px;width:min(560px,88vw)}
#boot .blines .ok{color:var(--green)}
#boot .bpbar{width:min(560px,88vw);height:3px;background:rgba(0,229,255,.12);border-radius:2px;margin-top:20px;overflow:hidden}
#boot .bpbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--teal),var(--cyan));box-shadow:0 0 12px rgba(0,229,255,.8);transition:width .3s}
#boot .bskip{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.24em;margin-top:26px;text-transform:uppercase}

/* ── toast / footer ─────────────────────────────────────────────────────── */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);z-index:9998;background:var(--panel3);border:1px solid var(--line2);border-radius:11px;padding:12px 20px;font-family:var(--mono);font-size:12px;color:var(--cyan);box-shadow:0 14px 40px rgba(0,0,0,.6),var(--glow-cy);opacity:0;pointer-events:none;transition:.25s;display:flex;gap:9px;align-items:center;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer.bot{
  position:fixed;bottom:0;left:0;right:0;z-index:90;background:linear-gradient(0deg,rgba(3,7,14,.96),rgba(3,7,14,.82));
  border-top:1px solid var(--line);backdrop-filter:blur(12px);padding:8px 20px;
}
.fwrap{max-width:1460px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em}
.fwrap .fdisc{color:var(--amber)}
main{padding-bottom:120px}

/* mode-link + misc */
.modelink{cursor:pointer;color:var(--cyan);border-bottom:1px dotted rgba(0,229,255,.5)}
.modelink:hover{text-shadow:var(--glow-cy)}
.pill-rows{display:flex;flex-direction:column;gap:7px}
.prow{display:flex;gap:10px;align-items:baseline;font-size:12.5px;line-height:1.55}
.prow .pk{font-family:var(--mono);font-size:9.5px;color:var(--cyan);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;min-width:120px;padding-top:2px}
.imgbox{border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;background:#04080f}
.imgbox img{display:block;width:100%}
.imgbox .cap{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.14em;padding:7px 11px;border-top:1px solid var(--line-soft);text-transform:uppercase}

/* ── responsive ─────────────────────────────────────────────────────────── */
@media(max-width:1120px){
  .wavelab{grid-template-columns:1fr}
  .rail{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}
  .rail .rgroup{width:100%}
  .g6{grid-template-columns:repeat(3,1fr)}
  .calcgrid{grid-template-columns:1fr}
}
@media(max-width:880px){
  #calcLayout{grid-template-columns:1fr !important}
  .rail{max-height:none}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
  .glossary{columns:1}
  .hsearch{order:5;width:100%;margin-left:0}
  .hclock{display:none}
  .logo .t2{display:none}
}
@media(max-width:600px){
  .g2,.g4,.g3,.g6{grid-template-columns:minmax(0,1fr)}
  main{padding:14px 12px 140px}
  .hwrap{padding:10px 12px}
  nav.tabs{padding:0 10px}
  .calcgrid{gap:10px}
  .deck .drow{grid-template-columns:1fr}
