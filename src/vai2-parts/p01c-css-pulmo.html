<style>
/* ═══════════════════════════════════════════════════════════════════════════
   PULMO AI MK-III — Sleep Lab · Nicotine Center · Guideline Corpus styles
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── sub-tabs (module-internal navigation) ─────────────────────────────── */
.stabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.stab{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line-soft);background:rgba(6,12,24,.6);border-radius:8px;padding:8px 13px;cursor:pointer;transition:.15s;
  display:inline-flex;align-items:center;gap:7px}
.stab svg{width:14px;height:14px}
.stab:hover{color:var(--cyan);border-color:var(--line2);box-shadow:0 0 10px rgba(0,229,255,.15)}
.stab.on{color:var(--cyan);border-color:var(--line2);background:rgba(0,229,255,.12);text-shadow:var(--glow-cy)}
.spane{display:none}
.spane.on{display:block;animation:fadeup .25s ease-out}

/* ══ PSG MONITOR ═════════════════════════════════════════════════════════ */
.psg-shell{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(4,8,17,.9);
  box-shadow:0 0 30px rgba(0,229,255,.06), inset 0 0 60px rgba(0,0,0,.4)}
.psg-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(0,229,255,.07),transparent)}
.psg-top .ttl{font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--cyan);text-shadow:var(--glow-cy);
  display:flex;align-items:center;gap:8px}
.psg-top .ttl .rec{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 9px var(--red);animation:blinkrec 1.1s infinite}
@keyframes blinkrec{0%,55%{opacity:1}56%,100%{opacity:.15}}
.psg-vitals{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.pv{display:flex;flex-direction:column;align-items:center;padding:6px 13px;border:1px solid var(--line-soft);border-radius:10px;
  background:rgba(5,11,22,.7);min-width:74px;position:relative;overflow:hidden}
.pv .pvv{font-family:var(--mono);font-size:19px;font-weight:700;line-height:1.1}
.pv .pvl{font-family:var(--mono);font-size:8px;letter-spacing:.18em;color:var(--dim);margin-top:2px}
.pv.spo2 .pvv{color:var(--green);text-shadow:0 0 12px rgba(61,255,176,.5)}
.pv.hr .pvv{color:var(--red);text-shadow:0 0 12px rgba(255,56,96,.5)}
.pv.br .pvv{color:var(--cyan)}
.pv.stg{min-width:96px}
.pv.stg .pvv{font-size:16px;color:var(--violet);text-shadow:0 0 12px rgba(177,140,255,.5)}
.pv.epoch .pvv{color:var(--amber);font-size:14px}
.pv .beat{position:absolute;right:7px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--red);opacity:0}
.pv .beat.on{opacity:1;box-shadow:0 0 8px var(--red)}
@keyframes beatp{0%{transform:scale(1.5);opacity:1}100%{transform:scale(1);opacity:0}}
.psg-body{display:grid;grid-template-columns:minmax(0,1fr) 258px;gap:0}
.psg-lanes{position:relative;border-right:1px solid var(--line-soft);min-width:0;background:
  repeating-linear-gradient(0deg,rgba(0,229,255,.018) 0 1px,transparent 1px 46px)}
.psg-lane{display:block;width:100%;height:46px;border-bottom:1px solid rgba(120,160,220,.07);position:relative}
.psg-lane canvas{display:block;width:100%;height:46px}
.psg-evtbanner{position:absolute;left:0;right:0;top:-1px;transform:translateY(-100%);pointer-events:none;z-index:5}
.psg-evtbanner .inner{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;padding:5px 12px;border-radius:0 0 9px 0;
  background:rgba(255,56,96,.14);border:1px solid rgba(255,56,96,.5);border-top:0;color:#ffb9c8;backdrop-filter:blur(6px)}
.psg-side{display:flex;flex-direction:column;min-height:0}
.psg-side .sh{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--dim);padding:8px 12px 5px;border-bottom:1px solid var(--line-soft)}
.psg-feed{flex:1;overflow-y:auto;max-height:308px;padding:7px 9px;display:flex;flex-direction:column;gap:5px}
.fitem{font-family:var(--mono);font-size:10px;line-height:1.45;padding:6px 8px;border-radius:7px;border:1px solid var(--line-soft);
  background:rgba(8,15,30,.75);animation:fadeup .3s ease-out}
.fitem .ft{font-weight:700}
.fitem.apnea{border-color:rgba(255,56,96,.45);background:rgba(255,56,96,.07)}
.fitem.apnea .ft{color:var(--red)}
.fitem.hypop{border-color:rgba(255,180,84,.4);background:rgba(255,180,84,.06)}
.fitem.hypop .ft{color:var(--amber)}
.fitem.desat{border-color:rgba(177,140,255,.4);background:rgba(177,140,255,.06)}
.fitem.desat .ft{color:var(--violet)}
.fitem.arousal{border-color:rgba(61,255,176,.35);background:rgba(61,255,176,.05)}
.fitem.arousal .ft{color:var(--green)}
.fitem.leg{border-color:rgba(0,229,255,.35);background:rgba(0,229,255,.05)}
.fitem.leg .ft{color:var(--cyan)}
.fitem.info{color:var(--muted)}
.fitem.info .ft{color:var(--teal)}
.psg-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);border-top:1px solid var(--line-soft)}
.psg-stats .ps{background:rgba(5,11,22,.92);padding:8px 10px}
.psg-stats .ps b{display:block;font-family:var(--mono);font-size:15px;color:var(--cyan)}
.psg-stats .ps span{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--dim)}
.psg-foot{border-top:1px solid var(--line);padding:9px 14px;display:flex;flex-direction:column;gap:9px;background:rgba(5,10,20,.8)}
.psg-ctl{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.psg-ctl .spacer{flex:1}
#psgHypno{width:100%;height:92px;display:block}
.psg-scen-note{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.55}
@media(max-width:900px){.psg-body{grid-template-columns:1fr}.psg-side{border-top:1px solid var(--line-soft)}}

/* stage badge colours */
.stgW{color:var(--amber)} .stgN1{color:var(--cyan)} .stgN2{color:var(--teal)} .stgN3{color:var(--violet)} .stgR{color:var(--mag)}

/* ── sleep stage atlas cards ───────────────────────────────────────────── */
.stagecard{border:1px solid var(--line-soft);border-radius:12px;background:var(--panel);padding:13px;position:relative;overflow:hidden}
.stagecard .band{position:absolute;left:0;top:0;bottom:0;width:3px}
.stagecard h4{font-family:var(--mono);letter-spacing:.14em;font-size:12px;margin-bottom:4px}
.stagecard .pct{position:absolute;right:12px;top:10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.stagecard ul{margin:8px 0 0}
.wave-demo{background:rgba(3,7,15,.85);border:1px solid var(--line-soft);border-radius:8px;height:64px;margin-top:10px;overflow:hidden}
.wave-demo canvas{display:block;width:100%;height:64px}

/* ── PAP mode cards ────────────────────────────────────────────────────── */
.papgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.papcard{border:1px solid var(--line-soft);border-radius:12px;background:var(--panel);padding:14px}
.papcard h4{display:flex;align-items:center;gap:8px;font-size:14px}
.papcard .rng{font-family:var(--mono);font-size:10.5px;color:var(--cyan);border:1px solid var(--line);border-radius:999px;padding:2px 9px}

/* ── quit timeline (smoking) ───────────────────────────────────────────── */
.qt{position:relative;margin:8px 0;padding-left:34px}
.qt::before{content:"";position:absolute;left:12px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,var(--cyan),var(--green) 45%,var(--teal));box-shadow:0 0 10px rgba(0,229,255,.4)}
.qt .ev{position:relative;margin-bottom:13px}
.qt .ev::before{content:"";position:absolute;left:-27px;top:4px;width:10px;height:10px;border-radius:50%;
  background:var(--bg1);border:2px solid var(--cyan);box-shadow:0 0 9px rgba(0,229,255,.55)}
.qt .ev.done::before{background:var(--cyan)}
.qt .yr{font-family:var(--mono);font-size:11px;color:var(--cyan);letter-spacing:.14em}
.qt .tt{font-size:13px;font-weight:600;color:#fff;margin:2px 0}
.qt .td{font-size:12px;color:var(--muted);line-height:1.55}

/* ── big counters (cigarette calculator) ───────────────────────────────── */
.ctrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.ctr{border:1px solid var(--line-soft);border-radius:12px;padding:14px;background:linear-gradient(160deg,rgba(0,229,255,.05),rgba(8,14,28,.7));position:relative;overflow:hidden}
.ctr::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,229,255,.14),transparent 70%)}
.ctr .cv{font-family:var(--mono);font-size:23px;font-weight:700;color:var(--cyan);text-shadow:var(--glow-cy);letter-spacing:.02em}
.ctr .cv.money{color:var(--amber);text-shadow:0 0 14px rgba(255,180,84,.4)}
.ctr .cv.loss{color:var(--red);text-shadow:0 0 14px rgba(255,56,96,.4)}
.ctr .cv.gain{color:var(--green);text-shadow:0 0 14px rgba(61,255,176,.4)}
.ctr .cl{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--dim);margin-top:5px;text-transform:uppercase}
.ctr .cs{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.5}

/* ── API console (nicotine + general query API) ────────────────────────── */
.apiterm{background:rgba(2,5,11,.92);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-family:var(--mono)}
.apiterm .ahead{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line-soft);
  font-size:10px;letter-spacing:.16em;color:var(--muted);background:rgba(0,229,255,.05)}
.apiterm .ahead .dots{display:flex;gap:5px}
.apiterm .ahead .dots i{width:9px;height:9px;border-radius:50%;display:block}
.apiterm .aout{padding:12px 14px;max-height:300px;overflow-y:auto;font-size:12px;line-height:1.65}
.apiterm .aout .ln{white-space:pre-wrap;word-break:break-word}
.apiterm .aout .ln.in{color:var(--cyan)}
.apiterm .aout .ln.ok{color:var(--green)}
.apiterm .aout .ln.err{color:var(--red)}
.apiterm .aout .ln.dim2{color:var(--muted)}
.apiterm .ain{display:flex;border-top:1px solid var(--line-soft)}
.apiterm .ain .pr{padding:11px 0 11px 13px;color:var(--teal);font-size:13px;user-select:none}
.apiterm .ain input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-family:var(--mono);font-size:12.5px;padding:11px 13px 11px 8px}
.apidocs{font-family:var(--mono);font-size:10.5px;line-height:1.75;color:var(--muted)}
.apidocs code{color:var(--teal);background:rgba(0,255,198,.07);padding:1px 6px;border-radius:5px;border:1px solid rgba(0,255,198,.18)}

/* ── guideline corpus ──────────────────────────────────────────────────── */
.gdl{border:1px solid var(--line-soft);border-radius:13px;background:var(--panel);margin-bottom:11px;overflow:hidden}
.gdl > .gh{display:flex;align-items:center;gap:11px;padding:13px 16px;cursor:pointer;transition:.15s}
.gdl > .gh:hover{background:rgba(0,229,255,.05)}
.gdl > .gh .gic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  border:1px solid var(--line);background:rgba(0,229,255,.07);color:var(--cyan)}
.gdl > .gh .gic svg{width:19px;height:19px}
.gdl > .gh .gt{min-width:0}
.gdl > .gh .gt .gn{font-size:14.5px;font-weight:600;color:#fff}
.gdl > .gh .gt .gs{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);margin-top:2px}
.gdl > .gh .tags{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.gdl > .gh .caret{color:var(--cyan);font-size:12px;transition:.2s}
.gdl.open > .gh .caret{transform:rotate(90deg)}
.gdl .gb{display:none;border-top:1px solid var(--line-soft);padding:6px 18px 18px}
.gdl.open .gb{display:block;animation:fadeup .25s ease-out}
.gdl .gb h4{margin-top:14px}
.recchip{font-family:var(--mono);font-size:9px;letter-spacing:.1em;border-radius:5px;padding:2px 7px;margin-left:7px;vertical-align:middle}
.recchip.strong{background:rgba(61,255,176,.12);color:var(--green);border:1px solid rgba(61,255,176,.4)}
.recchip.mod{background:rgba(0,229,255,.1);color:var(--cyan);border:1px solid var(--line2)}
.recchip.weak{background:rgba(255,180,84,.1);color:var(--amber);border:1px solid rgba(255,180,84,.4)}
.recchip.cond{background:rgba(177,140,255,.1);color:var(--violet);border:1px solid rgba(177,140,255,.4)}
.keynum{font-family:var(--mono);color:var(--teal);font-weight:700}

/* ── fagerström / score questionnaires ─────────────────────────────────── */
.qlist{display:flex;flex-direction:column;gap:9px}
.qrow{border:1px solid var(--line-soft);border-radius:11px;padding:11px 13px;background:rgba(7,13,26,.7)}
.qrow .qq{font-size:12.5px;color:var(--txt);margin-bottom:8px;font-weight:600}
.qopts{display:flex;flex-wrap:wrap;gap:6px}
.qopt{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line-soft);border-radius:7px;
  padding:6px 10px;cursor:pointer;transition:.12s;background:rgba(4,9,18,.6)}
.qopt:hover{color:var(--cyan);border-color:var(--line2)}
.qopt.on{color:var(--cyan);border-color:var(--line2);background:rgba(0,229,255,.13);text-shadow:var(--glow-cy)}
.qopt b{color:var(--amber);margin-left:6px}

/* ── organ harm grid ───────────────────────────────────────────────────── */
.organgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.organ{border:1px solid rgba(255,56,96,.22);border-radius:11px;padding:11px 13px;background:linear-gradient(160deg,rgba(255,56,96,.05),rgba(8,14,28,.6));transition:.15s}
.organ:hover{border-color:rgba(255,56,96,.5);box-shadow:0 0 16px rgba(255,56,96,.12)}
.organ .on{font-size:12.5px;font-weight:700;color:#ffb9c8;display:flex;align-items:center;gap:7px}
.organ .on svg{width:14px;height:14px;color:var(--red)}
.organ .od{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.55}

/* ── pharmacotherapy cards ─────────────────────────────────────────────── */
.pharm{border:1px solid var(--line-soft);border-radius:12px;background:var(--panel);padding:0;overflow:hidden}
.pharm .ph{padding:12px 15px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;background:rgba(0,229,255,.04)}
.pharm .ph .pn{font-size:14px;font-weight:700;color:#fff}
.pharm .ph .eff{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--green);border:1px solid rgba(61,255,176,.35);
  background:rgba(61,255,176,.08);border-radius:999px;padding:3px 10px;white-space:nowrap}
.pharm .pb{padding:12px 15px}
.pharm .pb h5{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--cyan);margin:9px 0 4px;text-transform:uppercase}
.pharm .pb h5:first-child{margin-top:0}
.pharm .pb ul{margin-left:16px}
.pharm .pb li{font-size:12px;color:var(--muted);line-height:1.6}
.pharm .pb li b{color:var(--txt)}

/* misc */
.lungs-anim{animation:breathe 4.6s ease-in-out infinite;transform-origin:center 60%}
@keyframes breathe{0%,100%{transform:scale(1)}45%{transform:scale(1.045)}60%{transform:scale(1.03)}}
.pulse-ring{position:relative}
.pulse-ring::after{content:"";position:absolute;inset:-4px;border-radius:inherit;border:1px solid rgba(0,229,255,.5);
  animation:pring 2.4s ease-out infinite;pointer-events:none}
@keyframes pring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
.countup{font-variant-numeric:tabular-nums}
</style>
